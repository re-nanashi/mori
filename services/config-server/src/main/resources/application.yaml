server:
  port: 8888

spring:
  application:
    name: mori-config-server
  profiles:
    active: native # dev: reads from filesystem; prod: git
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/