spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://MORI-USER-SERVICE
              predicates:
                - Path=/api/v1/users/**
              filters:
                - RewritePath=/api/v1/users/(?<segment>.*), /users/${segment}

management:
  endpoint:
    gateway:
      access: read-only
  endpoints:
    web:
      exposure:
        include: gateway, health, info

info:
  app:
    name: mori-api-gateway
    description: Mori API Gateway
    version: 0.0.1-SNAPSHOT
  java:
    version: ${java.version}