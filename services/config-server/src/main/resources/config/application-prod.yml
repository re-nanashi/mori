# overrides for ALL services in prod
eureka:
  client:
    service-url:
      defaultZone: http://eureka.mori.internal/eureka/ # change during prod

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.mori.app/realms/mori # change 'auth.mori.app' to actual domain

logging:
  level:
    root: WARN
    com.mori: INFO