services:
  postgres:
    image: postgres:16-alpine
    container_name: mori-postgres
    environment:
      POSTGRES_USER: mori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mori
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - mori-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mori -d mori"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

volumes:
  db-data:                                               # persistent storage

networks:
  mori-network:
    driver: bridge

volumes:
  postgres_data: