services:
  postgres:
    image: postgres:16-alpine
    container_name: mori-postgres
    environment:
      POSTGRES_USER: mori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mori
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - mori-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mori -d mori"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  keycloak: 
    image: quay.io/keycloak/keycloak:24.0
    container_name: mori-keycloak
    environment:
      KC_LOG_LEVEL: DEBUG
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/mori_keycloak
      KC_DB_USERNAME: mori
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - mori-network

  redis:
    image: redis:7-alpine
    container_name: mori-redis
    ports: 
      - "6379:6379"

networks:
  mori-network:
    driver: bridge

volumes:
  postgres_data:
